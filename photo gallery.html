<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform .3s ease, box-shadow .3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,.3);
        }
    </style>
</head>
<body>

<div class="container py-5">

    <h2 class="text-center mb-4">Responsive Photo Gallery</h2>

    <div class="row g-4 gallery">

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://picsum.photos/id/1015/600/400" alt="Nature 1">
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://picsum.photos/id/1016/600/400" alt="Nature 2">
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://picsum.photos/id/1018/600/400" alt="Nature 3">
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://picsum.photos/id/1020/600/400" alt="Nature 4">
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://picsum.photos/id/1024/600/400" alt="Nature 5">
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://picsum.photos/id/1025/600/400" alt="Nature 6">
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://picsum.photos/id/1035/600/400" alt="Nature 7">
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://picsum.photos/id/1039/600/400" alt="Nature 8">
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
