<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, yellow, yellow);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: pink;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333333;
            font-size: 24px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #666666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444444;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: yellow;
            box-shadow: 0 0 8px pink(102, 126, 234, 0.4);
        }

        textarea {
            height: 80px;
            resize: none;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .gender-options {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .gender-options label {
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, yellow, yellow);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            color: #888888;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Student Registration</h1>

        <form>
                <label for="fullname">Student Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required>
                 <br></br>
           
                <label for="regno">Register Number</label>
                <input type="text" id="regno" placeholder="Enter register number" required>
                 <br></br>

            <div class="row">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Age" required>
                     <br></br>

                
                    <label for="dept">Department</label>
                    <select id="dept" required>
                        <option value="" disabled selected>Select Department</option>
                        <option value="cs">Computer Application </option>
                        <option value="ca">Computer Science</option>
                        <option value="commerce">CSE</option>
                        <option value="maths">IT</option>
                    </select>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="gender-options">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                </div>
            </div>


            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" placeholder="Enter your address"></textarea>
            </div>
            <button type="submit">Submit Registration</button>
        </form>

        <div class="footer"></div>
    </div>

</body>
</html>
