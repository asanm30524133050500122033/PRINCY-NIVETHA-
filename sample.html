<!DOCTYPE html>
<head>
    <title>Registration Form</title>
</head>
<style>
    body
    {
        background-color: rebeccapurple;
    }
</style>
<body>
    <h1>Registration Form</h1>
    <form>
        <table>
            <tr>
                <td>Name:</td><td><input type="text" placeholder="Enter your Name"></td>
            </tr>
            <tr>
                <td>Age:</td><td><input type="placeholder="Enter your Age"></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="Gender">Male
                    <input type="radio" name="Gender">Female
                </td>
            <tr>
            <td>Father Name:</td>
            <td><input type="text" placeholder="Enter Your Name"></td>
            </tr>
            <tr>
                <td>Mother Name:</td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td>Blood Group:</td>
                <td><input type="text" placeholder="Enter your Blood Group"></td>
            </tr>
            <tr>
                <td>
                    Qualification:
                </td>
                <td><input type="text" placeholder="Enter your Qualification"></td>
            </tr>
            <tr>
                <td>DOB:</td>
                <td><input type="date" Name="DOB" placeholder="Enter your DOB"></td>
            </tr>
            <tr>
                <td>Hobbies:</td>
                <td>
                    <input type="checkbox" name="Hobbies">Watching shorts
                    <input type="checkbox" name="Hobbies">Reading books
                    <input type="checkbox" name="Hobbies">Playing
                    <input type="checkbox" name="Hobbies">listening music
                </td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="text" placeholder="Enter your Email"></td>
            </tr>
            <tr>
                <td>Select a course:</td>
                <td>
                    <select>
                        <option>python</option>
                        <option>c</option>
                        <option>c++</option>
                        <option>java</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><input type="reset"></td>
                <td><input type="submit"></td>
            </tr>
            </tr>
        </table>
    </form>
</body>
